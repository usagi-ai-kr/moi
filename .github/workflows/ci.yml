# moi CI — 0.x 품질 게이트 (fail-closed, 이슈 #10)
# - 임시 예외: scaffold(0.1.0) 이전에는 package.json이 없어 게이트를 건너뛴다.
#   package.json이 생성되면 이 예외는 자동 종료된다(문서: tdd-bdd-testing 스킬 '게이트 fail-closed 규칙').
# - scaffold 이후 필수 게이트: lint, typecheck, check:architecture, check:notices, test:unit, test:integration, test:bdd, build
#   미정의·스킵은 실패로 처리한다(fail-closed). test:bdd는 실제 실행되는 smoke만 인정한다.
# - pnpm 버전은 package.json의 packageManager 필드(pnpm 정확 버전)로 고정한다 — 없으면 실패.
name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  # 앱 버전 단일 소스(마일스톤 조회, scripts/resolve-version.mjs) — issues read 로 open 마일스톤을 읽는다.
  issues: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate skills (Agent Skills spec)
        run: node .agents/scripts/validate-skills.mjs

      - name: Check harness/src module budgets (ADR-0015)
        run: node .agents/skills/harness-budget/scripts/check-module-lengths.mjs

      - name: Detect scaffold
        id: scaffold
        run: |
          if [ -f package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice (no scaffold — 0.1.0 이전 임시 예외)
        if: steps.scaffold.outputs.ready != 'true'
        run: echo "::notice::package.json이 아직 없어 품질 게이트를 건너뜁니다(0.1.0 이전 임시 예외). scaffold PR에서 자동 종료됩니다."

      - name: Setup pnpm
        if: steps.scaffold.outputs.ready == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: steps.scaffold.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify packageManager pin
        if: steps.scaffold.outputs.ready == 'true'
        run: |
          node -e "
            const p = require('./package.json');
            if (!p.packageManager || !/^pnpm@\d+\.\d+\.\d+/.test(p.packageManager)) {
              console.error('::error::packageManager(pnpm 정확 버전)이 없습니다 — #1 scaffold 요구사항');
              process.exit(1);
            }
          "

      - name: Install
        if: steps.scaffold.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (chromium + WebKit #335)
        if: steps.scaffold.outputs.ready == 'true'
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Quality gates (fail-closed)
        if: steps.scaffold.outputs.ready == 'true'
        env:
          # 버전 단일 소스(gh api 마일스톤 조회) — 토큰 없이 조회 실패 시 빌드가 fail-closed 로 막힌다.
          GH_TOKEN: ${{ github.token }}
        run: |
          missing=0
          for script in lint typecheck check:architecture check:notices test:unit test:integration test:bdd build; do
            if node -e "process.exit(require('./package.json').scripts?.['$script'] ? 0 : 1)"; then
              echo "::group::pnpm run $script"
              pnpm run "$script"
              echo "::endgroup::"
            else
              echo "::error::필수 게이트 '$script'가 package.json에 없습니다 — fail-closed (#10)"
              missing=1
            fi
          done
          exit "$missing"

      - name: Upload Playwright evidence (#335)
        if: always() && steps.scaffold.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
