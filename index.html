<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="moi — AWS SAA 자격증 학습 사이트. 카카오 로그인으로 시작하는 SAA 학습 관리."
    />
    <meta name="theme-color" content="#232F3E" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="mask-icon" href="/icons/mask-icon.svg" color="#FF9900" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>moi — AWS SAA 학습</title>
    <!--
      첫 페인트용 토큰 폴백 — JS(applyTokens) 실행 전에도 정적 셸이 tokens.ts와 같은 값으로
      그려지도록 한다. 전체 목록은 tests/unit/static-shell.test.ts가 cssVars와 대조한다.
      applyTokens가 같은 값을 inline style로 덮어쓰므로 React 마운트 시 시각 변화가 없다.
    -->
    <style>
      :root {
        --moi-color-white: #FFFFFF;
        --moi-color-ink: #232F3E;
        --moi-color-muted: #6B7280;
        --moi-color-border: #E5E7EB;
        --moi-color-orange: #FF9900;
        --moi-font-display: 'KoddiUDOngodic', 'Inter Variable', 'Inter', system-ui, -apple-system,
          'Segoe UI', Roboto, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        --moi-font-ui: 'Inter Variable', 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto,
          'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        --moi-lh-tight: 1.15;
        --moi-lh-normal: 1.6;
        --moi-container-max: 960px;
        --moi-container-pad-x: clamp(16px, 5vw, 32px);
        --moi-header-h: 56px;
        --moi-accent-w: 48px;
        --moi-accent-h: 4px;
        --moi-space-2: 8px;
        --moi-space-3: 12px;
        --moi-space-4: 16px;
        --moi-space-7: 48px;
        --moi-size-brand: 20px;
        --moi-size-h1: clamp(32px, 7vw, 44px);
        --moi-size-lead: clamp(16px, 2.4vw, 18px);
        --moi-size-small: 13px;
      }
    </style>
  </head>
  <body>
    <!--
      정적 셸 — 로그아웃 홈 첫 화면. React createRoot가 이 내용을 교체한다.
      문구는 src/ui/copy.ts와 일치해야 하며 tests/unit/static-shell.test.ts가 검사한다.
      moi-enter(진입 애니메이션)는 넣지 않는다: 첫 페인트를 지연·재계산하지 않기 위함.
    -->
    <div id="root">
      <header class="moi-header">
        <div class="moi-container moi-header-inner">
          <span class="moi-brand">moi</span>
          <span class="moi-brand-sub">문제 중심 시험 대비 플랫폼</span>
        </div>
      </header>
      <main class="moi-main">
        <div class="moi-container moi-main-inner">
          <div class="moi-accent" aria-hidden="true"></div>
          <h1 class="moi-title">moi</h1>
          <p class="moi-lead">문제 중심 시험 대비 플랫폼</p>
          <p class="moi-note">
            카카오 로그인 → 20문제 풀이 → 저장·결과 확인. 현재 첫 학습 범위는 AWS SAA입니다.
          </p>
        </div>
      </main>
    </div>
    <script type="module" src="/src/bootstrap/web/main.tsx"></script>
  </body>
</html>
